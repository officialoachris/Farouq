<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dessert Cart</title>

    <link rel="stylesheet" href="./src/stylesheets/output.css" />
  </head>

  <body>
    <main class="bg-[#fcf8f5] h-full w-full px-25 py-25 mx-auto">
      <div
        class="max-w-[80vw] mx-auto h-full grid grid-cols-1 lg:grid-cols-[1fr_380px] gap-8"
      >
        <!-- ================================================================= -->
        <!-- Desserts Area -->
        <!-- ================================================================= -->
        <section class="w-full h-full">
          <h1 class="text-4xl font-bold text-[#260f08] mb-8">Desserts</h1>

          <!-- ================================================================= -->
          <!-- Product cards -->
          <!-- ================================================================= -->
          <div
            id="card_wrap"
            class="w-full grid sm:grid-cols-1 md:grid-cols-2 xl:grid-cols-3 place-items-center gap-x-6 gap-y-10"
          ></div>
        </section>

        <!-- ================================================================= -->
        <!-- Cart panel -->
        <!-- ================================================================= -->
        <aside class="bg-white rounded-xl p-6 h-fit">
          <h2 class="text-2xl font-bold text-[#c73b0f]">
            Your Cart (<span id="cart_count">0</span>)
          </h2>

          <!-- ================================================================= -->
          <!-- Empty-cart -->
          <!-- ================================================================= -->
          <div id="cart_container"></div>
        </aside>
      </div>
    </main>

    <div id="modal_container"></div>
    
    <script type="module" src="./src/scripts/app.js"></script>
  </body>
</html>
